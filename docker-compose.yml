name: data-engineering

# ==============================================================
# SHARED AIRFLOW CONFIGURATION
# ==============================================================

x-airflow-common: &airflow-common
  image: scraping-airflow:3.3.2
  pull_policy: never

  restart: unless-stopped

  environment: &airflow-common-env

    # ==========================================================
    # AIRFLOW CORE
    # ==========================================================

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: "true"

    # Airflow task logs are written locally for live reads and uploaded to
    # SeaweedFS S3 when each task closes so the UI can read logs after workers
    # restart or move to another host.
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://${S3_BUCKET_LOGS:-airflow-logs}/airflow
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
    AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "false"

    # The Amazon provider uses this connection for the S3 task log handler.
    # Credentials come from the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY above.
    AIRFLOW_CONN_AWS_DEFAULT: >-
      {"conn_type":"aws","extra":{"endpoint_url":"http://seaweedfs:8333","region_name":"${S3_REGION:-us-east-1}","config_kwargs":{"s3":{"addressing_style":"path"}}}}

    # Warehouse loading resolves this environment-defined Airflow connection
    # through the Postgres provider hook; credentials stay out of DAG code.
    AIRFLOW_CONN_PSE_WAREHOUSE: >-
      {"conn_type":"postgres","host":"warehouse-postgres","port":5432,"login":"${WAREHOUSE_USER:-warehouse}","password":"${WAREHOUSE_PASSWORD}","schema":"${WAREHOUSE_DB:-warehouse}","extra":{"sqlalchemy_scheme":"postgresql+psycopg2"}}

    # ==========================================================
    # AIRFLOW METADATA DATABASE
    # ==========================================================

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

    # ==========================================================
    # CELERY
    # ==========================================================

    AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

    AIRFLOW__OPERATORS__DEFAULT_QUEUE: default

    # ==========================================================
    # AIRFLOW API AUTHENTICATION
    # ==========================================================

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    # ==========================================================
    # SCHEDULER
    # ==========================================================

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # ==========================================================
    # DATA WAREHOUSE
    # ==========================================================

    WAREHOUSE_HOST: warehouse-postgres
    WAREHOUSE_PORT: "5432"

    WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}

    WAREHOUSE_DATABASE_URL: postgresql+psycopg2://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD}@warehouse-postgres:5432/${WAREHOUSE_DB:-warehouse}

    # ==========================================================
    # OBJECT STORAGE / DATA LAKE
    # ==========================================================

    S3_ENDPOINT_URL: http://seaweedfs:8333

    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}

    S3_BUCKET_RAW: ${S3_BUCKET_RAW:-raw}
    S3_BUCKET_STAGE: ${S3_BUCKET_STAGE:-stage}
    S3_BUCKET_CURATED: ${S3_BUCKET_CURATED:-curated}
    S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-quarantine}
    S3_BUCKET_LOGS: ${S3_BUCKET_LOGS:-airflow-logs}

    # Prevent AWS SDKs from trying EC2 metadata.
    AWS_EC2_METADATA_DISABLED: "true"

    # ==========================================================
    # APPLICATION
    # ==========================================================

    APP_ENV: ${APP_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # PSE EDGE portal capture and PSE website RSS ingestion use separate sources.
    PSE_EDGE_BASE_URL: "${PSE_EDGE_BASE_URL:-https://edge.pse.com.ph}"
    PSE_EDGE_RSS_FEEDS: "${PSE_EDGE_RSS_FEEDS:-}"
    PSE_WEBSITE_RSS_FEEDS: "${PSE_WEBSITE_RSS_FEEDS:-https://www.pse.com.ph/feed/}"
    PSE_EDGE_USER_AGENT: "${PSE_EDGE_USER_AGENT:-Mozilla/5.0 (compatible; PSEEdgeResearch/1.0)}"
    # Zero means no application-level cap; set a positive value for an explicit bounded run.
    PSE_MAX_SEARCH_PAGES: "${PSE_MAX_SEARCH_PAGES:-0}"
    PSE_MAX_COMPANY_PROFILES: "${PSE_MAX_COMPANY_PROFILES:-0}"
    PSE_MAX_PRICE_HISTORIES_PER_RUN: "${PSE_MAX_PRICE_HISTORIES_PER_RUN:-0}"
    PSE_PRICE_HISTORY_START_DATE: "${PSE_PRICE_HISTORY_START_DATE:-2000-01-01}"
    PSE_CALENDAR_START_YEAR: "${PSE_CALENDAR_START_YEAR:-2016}"
    PSE_MAX_CALENDAR_MONTHS: "${PSE_MAX_CALENDAR_MONTHS:-0}"
    PSE_MAX_DOCUMENTS_PER_RUN: "${PSE_MAX_DOCUMENTS_PER_RUN:-0}"
    PSE_EDGE_SEARCH_WINDOW_DAYS: "${PSE_EDGE_SEARCH_WINDOW_DAYS:-}"
    PSE_REQUEST_DELAY_SECONDS: "${PSE_REQUEST_DELAY_SECONDS:-0.5}"
    PSE_EDGE_CONCURRENCY: "${PSE_EDGE_CONCURRENCY:-6}"
    PSE_SOURCE_POOL_SLOTS: "${PSE_SOURCE_POOL_SLOTS:-6}"
    PSE_EDGE_JOB_SLOTS: "${PSE_EDGE_JOB_SLOTS:-}"
    PSE_EDGE_JOBS: "${PSE_EDGE_JOBS:-}"
    PSE_WEBSITE_BASE_URL: "${PSE_WEBSITE_BASE_URL:-https://www.pse.com.ph}"
    PSE_WEBSITE_USER_AGENT: "${PSE_WEBSITE_USER_AGENT:-Mozilla/5.0 (compatible; PSEPublicResearch/1.0)}"
    PSE_WEBSITE_CONCURRENCY: "${PSE_WEBSITE_CONCURRENCY:-4}"
    PSE_WEBSITE_REQUEST_DELAY_SECONDS: "${PSE_WEBSITE_REQUEST_DELAY_SECONDS:-0.75}"
    PSE_WEBSITE_MAX_PAGES: "${PSE_WEBSITE_MAX_PAGES:-10}"
    PSE_WEBSITE_POOL_SLOTS: "${PSE_WEBSITE_POOL_SLOTS:-2}"
    PSE_ETL_WORKERS: "${PSE_ETL_WORKERS:-4}"

    PYTHONPATH: /opt/airflow

  volumes:

    # Airflow
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config

    # Data engineering application
    - ./pipeline:/opt/airflow/pipeline

    # dbt project
    - ./dbt:/opt/airflow/dbt

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - data-network


# ==============================================================
# SERVICES
# ==============================================================

services:

  # ============================================================
  # AIRFLOW METADATA DATABASE
  #
  # Used ONLY by Airflow.
  #
  # Do not store scraped/business/analytics data here.
  # ============================================================

  airflow-postgres:
    image: postgres:17-alpine

    container_name: airflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - data-network


  # ============================================================
  # CELERY BROKER
  #
  # Redis is dedicated to Airflow / Celery.
  #
  # Queues:
  #
  # default
  # scrape-light
  # scrape-browser
  # transform
  #
  # ============================================================

  airflow-redis:
    image: redis:7-alpine

    container_name: airflow-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction

    volumes:
      - airflow-redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

    networks:
      - data-network


  # ============================================================
  # DATA WAREHOUSE
  #
  # This is where normalized / analytical data lives.
  #
  # Schemas could eventually include:
  #
  # ingestion
  # staging
  # intermediate
  # marts
  #
  # ============================================================

  warehouse-postgres:
    image: postgres:17-alpine

    container_name: warehouse-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}

    ports:
      - "${WAREHOUSE_PORT:-5433}:5432"

    volumes:
      - warehouse-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-warehouse}"
        ]

      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - data-network


  # ============================================================
  # PSE DATA OBSERVATORY
  #
  # Next.js interface for browsing warehouse records and ingestion runs.
  # ============================================================

  data-viewer:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: pse-data-viewer

    restart: unless-stopped

    environment:
      PGHOST: warehouse-postgres
      PGPORT: "5432"
      PGDATABASE: ${WAREHOUSE_DB:-warehouse}
      PGUSER: ${WAREHOUSE_USER:-warehouse}
      PGPASSWORD: ${WAREHOUSE_PASSWORD}
      NODE_ENV: production

    ports:
      - "127.0.0.1:${DATA_VIEWER_PORT:-3000}:3000"

    depends_on:
      warehouse-postgres:
        condition: service_healthy

    networks:
      - data-network


  # ============================================================
  # SEAWEEDFS
  #
  # S3-compatible data lake / object storage.
  #
  # Stores:
  #
  # raw
  # stage
  # curated
  # quarantine
  #
  # Ports:
  #
  # 8333 = S3 API
  # 8888 = Filer
  # 9333 = Master
  #
  # ============================================================

  seaweedfs:
    image: chrislusf/seaweedfs:latest

    container_name: seaweedfs

    restart: unless-stopped

    environment:

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}

      # SeaweedFS can bootstrap this bucket.
      S3_BUCKET: ${S3_BUCKET_RAW:-raw}

    ports:
      - "${S3_API_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"

    volumes:
      - seaweedfs-data:/data

    networks:
      - data-network


  # ============================================================
  # S3 BUCKET INITIALIZATION
  #
  # Creates the data lake and Airflow task log buckets after SeaweedFS starts.
  #
  # ============================================================

  s3-init:
    image: amazon/aws-cli:latest

    container_name: s3-init

    restart: "no"

    environment:

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}

      AWS_EC2_METADATA_DISABLED: "true"

    depends_on:
      seaweedfs:
        condition: service_started

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        echo "Waiting for SeaweedFS S3 API..."

        until aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api list-buckets > /dev/null 2>&1
        do
          echo "SeaweedFS is not ready yet..."
          sleep 2
        done

        echo "SeaweedFS S3 API is ready."

        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api create-bucket \
          --bucket ${S3_BUCKET_RAW:-raw} \
          2>/dev/null || true

        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api create-bucket \
          --bucket ${S3_BUCKET_STAGE:-stage} \
          2>/dev/null || true

        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api create-bucket \
          --bucket ${S3_BUCKET_CURATED:-curated} \
          2>/dev/null || true

        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api create-bucket \
          --bucket ${S3_BUCKET_QUARANTINE:-quarantine} \
          2>/dev/null || true

        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api create-bucket \
          --bucket ${S3_BUCKET_LOGS:-airflow-logs} \
          2>/dev/null || true

        echo "S3 buckets:"
        aws \
          --endpoint-url http://seaweedfs:8333 \
          s3api list-buckets

        echo "S3 initialization completed."

    networks:
      - data-network


  # ============================================================
  # AIRFLOW DATABASE INITIALIZATION
  # ============================================================

  airflow-init:
    <<: *airflow-common

    # This is the single build owner for the shared default Airflow image.
    build:
      context: ./airflow
      dockerfile: Dockerfile
      target: airflow-base

    restart: "no"

    entrypoint:
      - /bin/bash

    command:
    - -c
    - |
      set -e

      echo "Running Airflow database migrations..."
      airflow db migrate

      echo "Running FAB database migrations..."
      airflow fab-db migrate

      echo "Reconciling project-owned Airflow pools and admin account..."
      python /opt/airflow/bootstrap_runtime.py

      echo
      echo "Airflow initialization completed."

    environment:
      <<: *airflow-common-env

      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Data}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.local}

    depends_on:
      airflow-postgres:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW API SERVER + UI
  #
  # Airflow 3 replaces the old webserver architecture with
  # the API server.
  #
  # UI:
  #
  # http://localhost:8080
  #
  # ============================================================

  airflow-api-server:
    <<: *airflow-common

    container_name: airflow-api-server

    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    ports:
      - "${AIRFLOW_PORT:-8080}:8080"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-postgres:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully

    healthcheck:
        test:
          [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/version"
        ]

        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    command:
      - scheduler

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-postgres:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully

      airflow-redis:
        condition: service_healthy

    # This Airflow CLI probe can take longer during cold startup, so give it
    # room to finish and check once per minute instead of thrashing.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""
        ]

      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s


  # ============================================================
  # AIRFLOW DAG PROCESSOR
  #
  # Required by Airflow 3.
  #
  # Parses DAG files separately from the scheduler.
  # ============================================================

  airflow-dag-processor:
    <<: *airflow-common

    container_name: airflow-dag-processor

    command:
      - dag-processor

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-postgres:
        condition: service_healthy


  # ============================================================
  # AIRFLOW TRIGGERER
  #
  # Handles deferrable operators and asynchronous triggers.
  # ============================================================

  airflow-triggerer:
    <<: *airflow-common

    container_name: airflow-triggerer

    command:
      - triggerer

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-postgres:
        condition: service_healthy


  # ============================================================
  # DEFAULT CELERY WORKER
  #
  # Queue:
  #
  # default
  #
  # For miscellaneous/lightweight Airflow tasks.
  #
  # ============================================================

  airflow-worker-default:
    <<: *airflow-common

    command:
      - celery
      - worker
      - --queues
      - default
      - --concurrency
      - "${AIRFLOW_DEFAULT_WORKER_CONCURRENCY:-4}"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-api-server:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully


  # ============================================================
  # SCRAPLING LIGHT WORKER
  #
  # Queue:
  #
  # scrape-light
  #
  # Intended for:
  #
  # HTTP pages
  # static HTML
  # APIs
  # lightweight crawling
  # asynchronous extraction
  #
  # Scale:
  #
  # docker compose up -d \
  #   --scale airflow-worker-scrape-light=4
  #
  # ============================================================

  airflow-worker-scrape-light:
    <<: *airflow-common

    command:
      - celery
      - worker
      - --queues
      - scrape-light
      - --concurrency
      - "${SCRAPE_LIGHT_CONCURRENCY:-8}"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-api-server:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully


  # ============================================================
  # SCRAPLING BROWSER WORKER
  #
  # Queue:
  #
  # scrape-browser
  #
  # Intended for:
  #
  # JS-heavy websites
  # browser rendering
  # dynamic pages
  #
  # Browser workloads are expensive, so concurrency should stay
  # relatively low.
  #
  # Scale:
  #
  # docker compose up -d --scale airflow-worker-scrape-browser=2
  #
  # ============================================================

  airflow-worker-scrape-browser:
    <<: *airflow-common

    # Required by the JavaScript-rendered PSE Market Reports capture.
    image: scraping-airflow-browser:3.3.2
    build:
      context: ./airflow
      dockerfile: Dockerfile
      target: airflow-browser

    command:
      - celery
      - worker
      - --queues
      - scrape-browser
      - --concurrency
      - "${SCRAPE_BROWSER_CONCURRENCY:-2}"

    shm_size: "2gb"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-api-server:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully


  # ============================================================
  # TRANSFORMATION WORKER
  #
  # Queue:
  #
  # transform
  #
  # Intended for:
  #
  # Polars
  # Pydantic
  # Pandera
  # Parquet generation
  # PostgreSQL loading
  # dbt
  #
  # ============================================================

  airflow-worker-transform:
    <<: *airflow-common

    command:
      - celery
      - worker
      - --queues
      - transform
      - --concurrency
      - "${TRANSFORM_CONCURRENCY:-4}"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-api-server:
        condition: service_healthy

      airflow-redis:
        condition: service_healthy

      warehouse-postgres:
        condition: service_healthy

      s3-init:
        condition: service_completed_successfully


  # ============================================================
  # FLOWER
  #
  # Celery worker monitoring.
  #
  # Optional profile.
  #
  # Start:
  #
  # docker compose --profile monitoring up -d
  #
  # UI:
  #
  # http://localhost:5555
  #
  # ============================================================

  airflow-flower:
    <<: *airflow-common

    profiles:
      - monitoring

    container_name: airflow-flower

    command:
      - celery
      - flower

    ports:
      - "${FLOWER_PORT:-5555}:5555"

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      airflow-redis:
        condition: service_healthy


# ==============================================================
# PERSISTENT VOLUMES
# ==============================================================

volumes:

  # Airflow internal database
  airflow-postgres-data:
    name: scraping-airflow-postgres-data

  # Celery broker
  airflow-redis-data:
    name: scraping-airflow-redis-data

  # Analytics / warehouse database
  warehouse-postgres-data:
    name: scraping-warehouse-postgres-data

  # Raw / stage / curated object data
  seaweedfs-data:
    name: scraping-seaweedfs-data


# ==============================================================
# NETWORK
# ==============================================================

networks:

  data-network:
    name: scraping-data-network
    driver: bridge
