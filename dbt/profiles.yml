pse_edge_analytics:
  target: airflow
  outputs:
    airflow:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'warehouse-postgres') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('WAREHOUSE_USER', 'warehouse') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
